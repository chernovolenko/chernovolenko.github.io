{% assign ann_id = include.src | slugify %}
<div class="ann" id="ann-{{ ann_id }}">
    <img src="{{ include.src }}" alt="{{ include.alt | default: '' }}" />
    <div class="ann-tip"></div>
</div>
{% if include.caption %}<span class="ann-caption">{{ include.caption }}</span>{% endif %}
<script>
    annBuild("ann-{{ ann_id }}", {{ include.annotations | default: '[]' }});
</script>
